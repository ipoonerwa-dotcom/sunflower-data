# Rebuilds the SUNFLOWER team performance report and publishes it with GitHub Pages, each time
# cron-job.org starts it (every 10 minutes, through the workflow_dispatch API).
# The website (sunflower-web-lime.vercel.app) serves it from its own domain through a rewrite in its
# vercel.json, so members read it wherever they can open the site.
#
# A run reads only the blocks that are new since the last one (the cache below), proves the result
# against on-chain balances, and publishes nothing if that check fails: the previous report stays up.
# tools/build.sh retries a failed attempt, the last time from scratch, before giving up.

name: 更新团队业绩数据

on:
  # Started every 10 minutes by cron-job.org through the API, and by hand from the Actions tab.
  # Deliberately no `schedule:` -- GitHub's own scheduler runs late, or not at all, when it is busy.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run at a time, and a new run replaces whatever is still going. A healthy run takes half a
# minute, so nothing useful is ever cut short -- but on 2026-10-06 one run hung waiting at the Pages
# environment gate, and with "wait your turn" every run after it queued behind it and was dropped:
# three days without an update. Now the next trigger cancels a run that is stuck.
concurrency:
  group: update-report
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      RPC_URL: ${{ secrets.RPC_URL }}
      CACHE_DIR: .cache
      PRICE_CACHE: .cache/prices.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 检查密钥
        run: |
          if [ -z "$RPC_URL" ]; then
            echo "仓库还没有设置 RPC_URL 密钥：Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - name: 取回上次读过的链上数据
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: chain-${{ github.run_id }}
          restore-keys: chain-

      - name: 价格缓存打底
        run: |
          mkdir -p .cache
          [ -f .cache/prices.json ] || cp seed/prices.json .cache/prices.json

      - name: 计算业绩并和链上余额逐个对账（不通过会重试，仍不通过就不发布）
        run: bash tools/build.sh

      - name: 保存链上数据缓存
        if: always() && hashFiles('.cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: chain-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
